[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rfsoc4x2-loopback-demo"
version = "0.1.0"
description = "Pilot-locked OFDM demodulation and four-channel adaptive combining"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "scipy>=1.8", "matplotlib>=3.5"]

[project.scripts]
rfsoc-demo = "rfsoc_demo.cli:main"

[tool.setuptools.packages.find]
include = ["rfsoc_demo*"]
